name: Nightly Regression

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to test"
        required: false
        default: "staging"
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-regression
  cancel-in-progress: true

jobs:
  regression:
    name: Cross-browser Regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REGRESSION_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'staging' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REGRESSION_REF }}
      - name: Report regression target
        run: |
          echo "Running nightly regression against $REGRESSION_REF"
          git --no-pager log -1 --oneline
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npx playwright install --with-deps
      - name: Run regression against local Supabase
        run: |
          bash scripts/with-local-supabase.sh bash -c '
            npm run test:db &&
            npm run test:e2e
          '
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: nightly-regression-report
          path: |
            playwright-report
            test-results
          retention-days: 14
